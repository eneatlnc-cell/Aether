[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_solc = false
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

# 测试 profile：更高 runs 限制 gas 上限
[profile.test]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200

# CI profile：更严格
[profile.ci]
fuzz_runs = 1000
invariant_runs = 1000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
func_attrs_with_params_multiline = true
quote_style = "double"
number_underscore = "preserve"
